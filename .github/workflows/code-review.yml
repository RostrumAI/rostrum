name: Code review

# `pull_request_target` runs the workflow file and the reviewer code from the base
# branch, so a pull request cannot change the rules it is reviewed against. The
# pull request head is checked out separately and only ever read: its code is not
# installed, not executed, and not used to resolve dependencies. The fork guard
# keeps even that read to branches in this repository.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  # A manual run reviews a pull request on demand. It exists because this workflow
  # takes effect only once merged: a pull request that changes it cannot trigger it,
  # so the first run after merge is dispatched rather than automatic.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/rescan') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base

      - name: Read the pull request head and check for a fork
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          pull_request="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(echo "${pull_request}" | jq -r .head.sha)"
          head_repo="$(echo "${pull_request}" | jq -r .head.repo.full_name)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          if [ "${head_repo}" != "${REPOSITORY}" ]; then
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "Pull requests from forks are not reviewed automatically. Run 'bun run review --pr ${PR_NUMBER} --repo-root <head checkout>' locally instead."
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the pull request head for reading
        if: steps.target.outputs.fork == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          path: pr

      - name: Set up Bun
        if: steps.target.outputs.fork == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install the reviewer dependencies from the base branch
        if: steps.target.outputs.fork == 'false'
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Install the reviewer runtime
        if: steps.target.outputs.fork == 'false'
        run: bun add --global @oh-my-pi/pi-coding-agent@18.1.17

      - name: Review
        if: steps.target.outputs.fork == 'false'
        working-directory: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_MODEL: deepseek/deepseek-v4-flash
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun run review --pr "${PR_NUMBER}" --repo-root "${GITHUB_WORKSPACE}/pr" --post
        timeout-minutes: 30
