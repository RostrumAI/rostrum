name: Diagnostic review comment

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the payload
        run: |
          echo "event: ${{ github.event_name }}"
          echo "action: ${{ github.event.action }}"
          echo "pr: ${{ github.event.pull_request.number }}"
          echo "comment id: ${{ github.event.comment.id }}"
          echo "in_reply_to: ${{ github.event.comment.in_reply_to_id }}"
          echo "author: ${{ github.event.comment.user.login }} type=${{ github.event.comment.user.type }}"
          echo "association: ${{ github.event.comment.author_association }}"
