name: Diagnostic events

# Control built in: `issue_comment` is known to fire, so if the timeline job runs
# and the review-comment job does not, the file is live and only the review event
# is dead. If neither runs, the file itself is not registered.
on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review_comment:
    name: Got review comment
    if: github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - run: echo "review comment: id=${{ github.event.comment.id }} reply_to=${{ github.event.comment.in_reply_to_id }} by=${{ github.event.comment.user.login }}"

  issue_comment:
    name: Got timeline comment
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - run: echo "timeline comment ${{ github.event.comment.id }}"
