name: Code review retrospective

# The retrospective turns adjudications into proposed rule changes. It runs on a
# schedule because the signal it needs is a week's worth of answers, and it opens
# a pull request rather than editing the corpus: a rule is only ever weakened by a
# person deciding to weaken it.
on:
  schedule:
    # Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Days to look back
        required: false
        default: "7"
        type: string

concurrency:
  group: code-review-retro
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  retrospective:
    name: Propose rule changes
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retrospective
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: bun run review:retro --days "${DAYS}" --open-pr
        timeout-minutes: 30
