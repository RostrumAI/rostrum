name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rostrum
          POSTGRES_PASSWORD: rostrum
          POSTGRES_DB: rostrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostrum -d rostrum"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: TypeScript peer compatibility (E1-S0 row 2)
        run: bun run check:peers

      - name: Lint and format
        run: bun run lint

      - name: Test (E1-S0 rows 1, 3-14)
        run: bun test
        env:
          DATABASE_URL: postgres://rostrum:rostrum@localhost:5432/rostrum
