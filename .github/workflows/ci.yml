name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Install, typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rostrum
          POSTGRES_PASSWORD: rostrum
          POSTGRES_DB: rostrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rostrum -d rostrum"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The service container listens without TLS on a literal loopback address.
      # The database layer defaults to verified TLS, so a plaintext loopback
      # target and the local exception must both be declared explicitly.
      DATABASE_URL: postgres://rostrum:rostrum@127.0.0.1:5432/rostrum
      DATABASE_TLS_MODE: disable
      ALLOW_INSECURE_LOCAL: "true"
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Smoke boot
        run: bun run --filter "@rostrum/control-api" smoke
